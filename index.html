<style>
:root{
  --ind:#3A3872; --ind2:#2A2860; --ind3:#1F1D4A; --yel:#FCC52C; --yel-d:#B98A0A;
  --red:#E5483F; --org:#FF8A1F; --grn:#2FA65A; --blu:#2E7DD7; --wht:#F6F5FB;
  --sh:rgba(15,14,50,.38);
  --font:"Avenir Next","Nunito","Segoe UI Rounded","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
html{background:#2A2860}
body{
  min-height:100vh;min-height:100dvh;font-family:var(--font);color:#fff;overflow-x:hidden;
  background:var(--ind2);-webkit-tap-highlight-color:transparent;
}
button,a{font:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.card:focus-visible,.mini summary:focus-visible{outline-color:var(--yel)}

/* fundo: pecinhas de cubo à deriva */
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;
  background:radial-gradient(120% 70% at 85% -10%,#4d4aa6 0%,transparent 55%),linear-gradient(170deg,var(--ind) 0%,var(--ind2) 60%,var(--ind3) 100%)}
.bgs{position:absolute;border-radius:24%;opacity:.13;animation:drift ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(34px,-70px) rotate(100deg)}}

/* cabeçalho */
.hdr{position:relative;z-index:5;display:none;align-items:center;justify-content:space-between;gap:12px;
  max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 18px 8px}
body.playing .hdr{display:flex}
.brand{background:#fff;border-radius:999px;padding:7px 15px;display:flex;box-shadow:0 4px 0 var(--sh)}
.brand img{height:24px;width:auto;display:block}
.prog{display:grid;grid-template-columns:repeat(3,13px);gap:3px;padding:5px;background:rgba(0,0,0,.3);border-radius:9px}
.prog i{width:13px;height:13px;border-radius:3px;background:rgba(255,255,255,.16);transition:background .3s,transform .3s}
.prog i.on{background:var(--c);transform:scale(1.06)}
.prog.solved i{background:var(--yel);transition-delay:calc(var(--n)*40ms)}
body.done .prog{display:none}

/* palco */
.stage{position:relative;z-index:1;display:grid;max-width:760px;margin:0 auto;
  padding:6px 18px calc(36px + env(safe-area-inset-bottom));min-height:calc(100vh - 64px);min-height:calc(100dvh - 64px)}
body:not(.playing) .stage{min-height:100vh;min-height:100dvh;align-content:center}
.view{grid-area:1/1;align-self:start;min-width:0}
body:not(.playing) .view{align-self:center}
.view:focus{outline:none}
.in-r{animation:inR .4s cubic-bezier(.2,.8,.2,1) backwards}
.in-l{animation:inL .4s cubic-bezier(.2,.8,.2,1) backwards}
.out-l{animation:outL .3s ease forwards;pointer-events:none}
.out-r{animation:outR .3s ease forwards;pointer-events:none}
@keyframes inR{from{opacity:0;transform:translateX(50px) scale(.98)}}
@keyframes inL{from{opacity:0;transform:translateX(-50px) scale(.98)}}
@keyframes outL{to{opacity:0;transform:translateX(-50px) scale(.98)}}
@keyframes outR{to{opacity:0;transform:translateX(50px) scale(.98)}}

/* abertura */
.splash{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 0}
.logo-card{background:#fff;border-radius:32px;padding:22px 26px;width:min(300px,80%);
  box-shadow:0 12px 0 var(--sh);animation:float 4.5s ease-in-out infinite}
.logo-card img{display:block;width:100%;height:auto}
@keyframes float{50%{transform:translateY(-8px) rotate(-1deg)}}
.splash h1{font-size:clamp(34px,10vw,54px);line-height:1.04;font-weight:900;letter-spacing:-.02em;margin-top:34px;text-wrap:balance}
.splash p{margin-top:14px;font-size:19px;line-height:1.35;max-width:24ch;opacity:.93}
.splash .btn{margin-top:30px;min-width:240px;font-size:21px;padding:18px 30px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.045)}}

/* perguntas */
.q{font-size:clamp(25px,6.6vw,36px);line-height:1.14;font-weight:900;letter-spacing:-.01em;margin-top:16px;text-wrap:balance}
.hint{margin-top:8px;font-weight:700;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:22px}
.card{appearance:none;border:0;cursor:pointer;position:relative;background:#fff;color:var(--ind);
  border-radius:22px;min-height:126px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  text-align:center;box-shadow:0 6px 0 var(--sh);transition:transform .14s,box-shadow .14s,background .2s;
  animation:pop .5s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--d) + 140ms)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.9)}}
.card .emo{font-size:44px;line-height:1;display:block}
.card .lbl{font-weight:800;font-size:15.5px;line-height:1.2}
.card:active,.card.sel{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.card.sel{background:var(--yel)}
.card.sel .emo{animation:bounce .55s}
.card.sel::after{content:"✓";position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;
  background:var(--ind);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900;animation:pop .35s backwards}
@keyframes bounce{30%{transform:scale(1.35) rotate(-8deg)}60%{transform:scale(.92) rotate(5deg)}}
.grid.odd .card:last-child{grid-column:1/-1;flex-direction:row;min-height:88px;gap:16px}
@media (hover:hover){.card:hover:not(.sel){transform:translateY(-3px);box-shadow:0 9px 0 var(--sh)}}

/* botões */
.btn{appearance:none;border:0;cursor:pointer;font-weight:900;font-size:17px;line-height:1.1;border-radius:18px;padding:17px 22px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;text-align:center;
  transition:transform .14s,box-shadow .14s,opacity .2s}
.btn.pri{background:var(--yel);color:var(--ind);box-shadow:0 6px 0 var(--yel-d)}
.btn.pri:active{transform:translateY(4px);box-shadow:0 2px 0 var(--yel-d)}
.btn.sec{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.btn.sec:active{transform:scale(.98)}
.btn.wide{width:100%;margin-top:22px}
.btn[disabled]{opacity:.4;pointer-events:none}
.ghost{appearance:none;background:none;border:0;color:rgba(255,255,255,.85);font-weight:800;padding:14px;margin:12px auto 0;display:block;cursor:pointer}

/* cubo 3D (carregando) */
.calc{display:grid;place-items:center;align-content:center;gap:42px;text-align:center;min-height:62vh}
.scene{width:96px;height:96px;perspective:600px}
.cube{position:relative;width:96px;height:96px;transform-style:preserve-3d;animation:spin 2.4s linear infinite}
@keyframes spin{from{transform:rotateX(-28deg) rotateY(0)}to{transform:rotateX(-28deg) rotateY(360deg)}}
.face{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4px;padding:4px;background:#14123a;border-radius:9px}
.face span{border-radius:4px;transition:background .25s}
.face.front{transform:translateZ(48px)}
.face.back{transform:rotateY(180deg) translateZ(48px)}
.face.right{transform:rotateY(90deg) translateZ(48px)}
.face.left{transform:rotateY(-90deg) translateZ(48px)}
.face.top{transform:rotateX(90deg) translateZ(48px)}
.face.bottom{transform:rotateX(-90deg) translateZ(48px)}
.calc-t{font-size:21px;font-weight:800}

/* resultado */
.result>*+*{margin-top:14px}
.hero{background:#fff;color:var(--ind);border-radius:32px;padding:24px 20px 24px;text-align:center;
  box-shadow:0 10px 0 var(--sh);margin-top:8px;animation:rise .7s cubic-bezier(.2,1.25,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.94)}}
.lead{font-weight:800;font-size:17px;opacity:.8}
.ring{position:relative;width:152px;height:152px;margin:14px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .rbg{stroke:#E7E6F4}
.ring .rfg{stroke:var(--ind);stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.3,.9,.3,1) .35s}
.ring .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:66px;animation:bounce .9s .5s backwards}
.pct{margin-top:12px;font-weight:900;font-size:19px}
.hero h2{font-size:clamp(26px,7.4vw,34px);font-weight:900;line-height:1.08;margin-top:12px;text-wrap:balance}
.area{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 13px;border-radius:99px;background:#EFEEF9;font-weight:800;font-size:14px}
.area i{width:11px;height:11px;border-radius:50%;background:var(--ac)}
.tag{margin-top:14px;font-size:17px;line-height:1.42;max-width:34ch;margin-inline:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:var(--ind);color:#fff;border-radius:99px;padding:7px 13px;font-weight:800;font-size:14px}

.mini{background:rgba(255,255,255,.12);border-radius:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);overflow:hidden}
.mini summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.mini summary::-webkit-details-marker{display:none}
.mini .emo{font-size:32px;line-height:1}
.mini .nm{flex:1;font-weight:900;font-size:17px;line-height:1.2}
.mini .pc{font-weight:800;font-size:13.5px;line-height:1.15;color:var(--yel);text-align:right;max-width:7.5em}
.mini .caret{transition:transform .25s;opacity:.8}
.mini[open] .caret{transform:rotate(180deg)}
.mini .more{padding:0 16px 18px;line-height:1.4;font-size:16px}
.mini .chips{justify-content:flex-start}
.mini .chip{background:rgba(255,255,255,.16)}

.hero.tied{padding-top:22px}
.tcourse{padding:18px 0 4px;margin-top:14px;border-top:2px dashed #DAD8EE}
.tcourse .emo{font-size:54px;line-height:1;display:block;animation:bounce .9s .4s backwards}
.tcourse h2{font-size:clamp(23px,6.4vw,29px);margin-top:8px}
.sech{font-size:18px;font-weight:900;line-height:1.25;margin-top:28px;text-wrap:balance}
.plan{background:#fff;color:var(--ind);border-radius:26px;padding:20px 20px 12px;box-shadow:0 8px 0 var(--sh)}
.plan h3{font-size:21px;font-weight:900}
.plan p{margin-top:4px;font-size:15px;opacity:.8;font-weight:700}
.plan ol{list-style:none;margin-top:8px;counter-reset:n;padding:0}
.plan li{counter-increment:n;display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:2px solid #E3E2F2;font-weight:800;font-size:18px;line-height:1.2}
.plan li:last-child{border-bottom:0}
.plan li::before{content:counter(n) ".";font-size:34px;font-weight:900;color:#E3A80F;min-width:26px;line-height:1}


.actions{display:grid;gap:12px;margin-top:20px}
.all summary{cursor:pointer;font-weight:800;padding:14px 4px;opacity:.92}
.all ul{list-style:none;padding:0;display:grid;gap:10px;padding-bottom:6px}
.all li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-weight:700;font-size:15px}
.all .bar{grid-column:1/-1;height:8px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden}
.all .bar b{display:block;height:100%;width:0;border-radius:6px;background:var(--c);transition:width 1s cubic-bezier(.3,.9,.3,1)}
.fine{font-size:13.5px;line-height:1.45;opacity:.78;text-align:center;margin-top:20px}

#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:30;
  background:#fff;color:var(--ind);font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 6px 0 var(--sh);transition:.3s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* telas maiores (tablet, notebook, quiosque) */
@media (min-width:700px){
  .stage,.hdr{max-width:820px}
  .q{font-size:40px}
  .grid{gap:18px}
  .card{min-height:172px;gap:12px}
  .card .emo{font-size:62px}
  .card .lbl{font-size:19px}
  .grid.odd .card:last-child{min-height:110px}
  .brand img{height:30px}
  .actions{grid-template-columns:1fr 1fr}
  .actions .ghost,.actions .btn.pri{grid-column:1/-1}
}
@media (max-width:359px){.card .lbl{font-size:14px}.card .emo{font-size:38px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
  .bgs{display:none}
}
.tcourse:first-of-type{border-top:0;margin-top:2px;padding-top:12px}

</style>
</head>

/* ---------- pontuação ---------- */
/* Cada traço aparece em um número diferente de opções; para que nenhum
   "pese" mais só por aparecer mais vezes, o total de cada traço é dividido
   pelo valor esperado de respostas aleatórias. */
const EXPECT = (() => {
  const e = {}; TRAITS.forEach(t => e[t] = 0);
  const mean = (opts, t) => opts.reduce((s, o) => s + (o.w[t] || 0), 0) / opts.length;
  TRAITS.forEach(t => {
    QUESTIONS.forEach(q => e[t] += mean(q.opts, t));
    e[t] += FINAL.max * mean(FINAL.opts, t);
    if (!e[t]) e[t] = 1;
  });
  const vals = TRAITS.map(t => e[t]).sort((a, b) => a - b), floor = vals[Math.floor(vals.length / 2)] * 0.9;
  TRAITS.forEach(t => e[t] = Math.max(e[t], floor));
  return e;
})();

function sumTraits(answers, finalSel){
  const u = {}; TRAITS.forEach(t => u[t] = 0);
  const add = w => { for (const k in w) u[k] += w[k]; };
  answers.forEach((k, i) => { if (k != null) add(QUESTIONS[i].opts[k].w); });
  (finalSel || []).forEach(k => add(FINAL.opts[k].w));
  TRAITS.forEach(t => u[t] = u[t] / EXPECT[t]);
  return u;
}
function cosine(u, w){
  let d = 0, a = 0, b = 0;
  for (const t of TRAITS){ const x = u[t] || 0, y = w[t] || 0; d += x*y; a += x*x; b += y*y; }
  return (a && b) ? d / Math.sqrt(a*b) : 0;
}
function rank(u, boosts){
  boosts = boosts || {};
  return COURSES.map(c => ({ c, s: cosine(u, c.w) + (boosts[c.id] || 0) }))
    .sort((x, y) => y.s - x.s || x.c.nome.localeCompare(y.c.nome))
    .map(r => ({ c: r.c, cos: r.s, pct: pctOf(r.s) }));
}
/* Afinidade exibida (0-100): mapeia a pontuação para uma escala fácil de ler */
function pctOf(s){ return Math.max(5, Math.min(99, Math.round(100 * Math.pow(Math.min(1, s), 0.6)))); }

const WINDOW = 0.10;  /* vizinhos a até 0,10 do 1º entram no desempate */
const BOOST  = 0.05;  /* bônus por resposta de desempate */
const TIE    = 0.04;  /* diferença abaixo disso é empate */

function clusterOf(id){ for (const k in CLUSTERS) if (CLUSTERS[k].includes(id)) return k; return null; }
function planTiebreak(R){
  const top = R[0], cl = clusterOf(top.c.id); if (!cl) return null;
  const cont = R.filter(r => clusterOf(r.c.id) === cl && top.cos - r.cos <= WINDOW).map(r => r.c.id);
  if (cont.length < 2) return null;
  return { cluster: cl, contenders: cont,
    qs: TB[cl].map(q => ({ q: q.q, opts: cont.map(id => ({ id, e: q.o[id].e, t: q.o[id].t })) })) };
}
function boostsFrom(picks){ const b = {}; (picks || []).forEach(id => { if (id) b[id] = (b[id] || 0) + BOOST; }); return b; }
/* fluxo completo (usado nos testes) */
function pipeline(answers, finalSel, pickTb){
  const u = sumTraits(answers, finalSel);
  let R = rank(u); const plan = planTiebreak(R);
  if (!plan) return { R, plan: null };
  const picks = plan.qs.map((q, i) => pickTb(q, i, plan));
  return { R: rank(u, boostsFrom(picks)), plan, picks };
}

/* export (testes) */ if (typeof module !== 'undefined') module.exports = { TRAITS, AREAS, COURSES, QUESTIONS, FINAL, sumTraits, cosine, rank, pctOf, CLUSTERS, TB, WINDOW, BOOST, TIE, clusterOf, planTiebreak, boostsFrom, pipeline };

    show(el, 1);
    const cube = $('#cube', el);
    const solved = [CUBE[0], CUBE[1], CUBE[2], CUBE[3], CUBE[4], CUBE[5]];
    const cells = [];
    ['front', 'back', 'right', 'left', 'top', 'bottom'].forEach((f, fi) => {
      const d = h('div', 'face ' + f);
      for (let i = 0; i < 9; i++) {
        const s = document.createElement('span');
        s.style.background = CUBE[(Math.random() * 6) | 0];
        d.appendChild(s); cells.push([s, solved[fi]]);
      }
      cube.appendChild(d);
    });
    if (REDUCE) { cells.forEach(c => c[0].style.background = c[1]); setTimeout(result, 500); return; }
    const order = cells.slice().sort(() => Math.random() - .5), ticks = 11; let n = 0;
    const iv = setInterval(() => {
      n++;
      const upto = Math.ceil(order.length * n / ticks);
      for (let i = 0; i < upto; i++) order[i][0].style.background = order[i][1];
      if (n >= ticks) { clearInterval(iv); setTimeout(result, 650); }
    }, 170);
  }

  /* ---------- resultado ---------- */
  const CIRC = 2 * Math.PI * 54;
  const ar = c => AREAS[c.area];
  const chips = c => c.chips.map(x => `<span class="chip">${x}</span>`).join('');
  function waLink(top) {
    const txt = `Olá! Fiz o quiz "Qual curso combina com você?"${ORIGEM ? ' durante ' + ORIGEM : ''} e meu resultado foi: ` +
      top.map((r, i) => `${i + 1}) ${r.c.nome}`).join(', ') + '. Quero saber mais sobre os cursos da UNIFASAR!';
    return `https://wa.me/${CFG.whats}?text=${encodeURIComponent(txt)}`;
  }
  /* níveis em palavras: números exatos passariam falsa precisão */
  const absLevel = s => s >= 0.75 ? 'Afinidade muito alta' : s >= 0.6 ? 'Afinidade alta' : 'Boa afinidade';
  const relLevel = d => d <= 0.12 ? 'Bem próximo' : 'Também combina';

  function result() {
    mode = 'result';
    document.body.classList.add('done');
    const R = rank(sumTraits(answers, finalSel), boostsFrom(tbPicks));
    const top = R.slice(0, 3), a = top[0];
    const tied = top.filter(r => a.cos - r.cos <= TIE), isTie = tied.length > 1;
    const rest = top.filter(r => !tied.includes(r));

    const mini = (r, label) => `<details class="mini" style="--ac:${ar(r.c).cor}">
        <summary><span class="emo" aria-hidden="true">${r.c.emoji}</span><span class="nm">${r.c.nome}</span>
        <span class="pc">${label}</span><span class="caret" aria-hidden="true">▾</span></summary>
        <div class="more">${r.c.tag}<div class="chips">${chips(r.c)}</div></div></details>`;

    let hero;
    if (!isTie) {
      hero = `<div class="hero" style="--ac:${ar(a.c).cor}">
         <p class="lead">Seu curso mais afim é…</p>
         <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="rbg" cx="60" cy="60" r="54"/>
           <circle class="rfg" cx="60" cy="60" r="54" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}" data-pct="${a.pct}"/></svg>
           <span class="emo" aria-hidden="true">${a.c.emoji}</span></div>
         <p class="pct">${absLevel(a.cos)}</p>
         <h2>${a.c.nome}</h2>
         <span class="area"><i></i>${ar(a.c).nome}</span>
         <p class="tag">${a.c.tag}</p>
         <div class="chips">${chips(a.c)}</div>
       </div>`;
    } else {
      hero = `<div class="hero tied">
         <p class="lead">Empate! Você combina com ${tied.length === 2 ? 'estes 2 cursos' : 'estes 3 cursos'}…</p>
         ${tied.map(r => `<div class="tcourse" style="--ac:${ar(r.c).cor}">
            <span class="emo" aria-hidden="true">${r.c.emoji}</span><h2>${r.c.nome}</h2>
            <span class="area"><i></i>${ar(r.c).nome}</span>
            <p class="tag">${r.c.tag}</p><div class="chips">${chips(r.c)}</div></div>`).join('')}
       </div>`;
    }

    /* cursos da mesma família que não entraram no top 3 */
    const fam = (CLUSTERS[clusterOf(a.c.id)] || []);
    const kin = R.filter(r => fam.includes(r.c.id) && !top.includes(r)).slice(0, 3);

    const el = h('section', 'result',
      `${hero}
       ${rest.map(r => mini(r, relLevel(a.cos - r.cos))).join('')}
       <section class="plan"><h3>Meus 3 cursos favoritos</h3>
         <p>Anote no “Plano de decisão” do seu folder.</p>
         <ol>${top.map(r => `<li>${r.c.nome}</li>`).join('')}</ol></section>
       ${kin.length ? `<p class="sech">Cursos da mesma família que também podem te interessar</p>
         ${kin.map(r => mini(r, relLevel(a.cos - r.cos))).join('')}` : ''}
       <div class="actions">
         <a class="btn pri" href="${waLink(top)}" target="_blank" rel="noopener">💬 Tirar dúvidas no WhatsApp</a>
         <a class="btn sec" href="${CFG.inscricao}" target="_blank" rel="noopener">Conhecer os cursos e se inscrever</a>
         ${KIOSK ? '' : '<button class="btn sec" id="share">Compartilhar o quiz</button>'}
         <button class="ghost" id="again">Refazer o quiz</button>
       </div>
       <details class="all"><summary>Ver minha afinidade com todos os cursos</summary>
         <ul>${R.map(r => `<li><span aria-hidden="true">${r.c.emoji}</span><span>${r.c.nome}</span>
            <span class="bar"><b style="--c:${ar(r.c).cor}" data-w="${r.pct}"></b></span></li>`).join('')}</ul></details>
       <p class="fine">Quiz de orientação para se divertir e descobrir caminhos. Ele não substitui uma orientação vocacional profissional.<br>
         UNIFASAR · (31) 3062-2001 · unifasar.edu.br</p>`);
    show(el, 1);
    $('#again', el).addEventListener('click', splash);
    const sh = $('#share', el); if (sh) sh.addEventListener('click', share);
    el.querySelector('.all').addEventListener('toggle', e => {
      if (e.target.open) requestAnimationFrame(() => el.querySelectorAll('.bar b').forEach(b => b.style.width = b.dataset.w + '%'));
    });
    const fg = $('.rfg', el);
    if (fg) requestAnimationFrame(() => requestAnimationFrame(() => { fg.style.strokeDashoffset = CIRC * (1 - fg.dataset.pct / 100); }));
    setTimeout(confetti, 250);
  }

  /* ---------- compartilhar ---------- */
  async function share() {
    const url = location.href.split('#')[0].split('?')[0];
    const text = 'Descubra qual curso combina com você! Faça o quiz da UNIFASAR.';
    try { if (navigator.share) { await navigator.share({ title: document.title, text, url }); return; } }
    catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); toast('Link copiado!'); } catch (e) { toast(url); }
  }

  /* ---------- confete ---------- */
  function confetti() {
    if (REDUCE) return;
    const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const P = [];
    for (let i = 0; i < 120; i++) P.push({
      x: innerWidth / 2 + (Math.random() - .5) * 90, y: innerHeight * .38,
      vx: (Math.random() - .5) * 15, vy: -Math.random() * 14 - 4, s: 7 + Math.random() * 7,
      c: CUBE[(Math.random() * 6) | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .45, g: .34 + Math.random() * .16
    });
    let last = performance.now();
    (function f(t) {
      const dt = Math.min(32, t - last) / 16; last = t;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
      let alive = false;
      P.forEach(p => {
        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .99; p.r += p.vr * dt;
        if (p.y < innerHeight + 24) alive = true;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
      });
      if (alive) requestAnimationFrame(f); else ctx.clearRect(0, 0, cv.width, cv.height);
    })(last);
  }

  /* ---------- modo quiosque: volta ao início após 60 s parado ---------- */
  function bump() { clearTimeout(idleT); if (KIOSK && mode !== 'splash') idleT = setTimeout(splash, 60000); }
  ['pointerdown', 'keydown', 'scroll'].forEach(ev => addEventListener(ev, bump, { passive: true }));

  /* ---------- fundo ---------- */
  (function () {
    const bg = $('#bg');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('i'), z = 18 + Math.random() * 36;
      s.className = 'bgs';
      s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${z}px;height:${z}px;background:${CUBE[i % 6]};` +
        `animation-duration:${14 + Math.random() * 16}s;animation-delay:-${Math.random() * 20}s`;
      bg.appendChild(s);
    }
  })();

  splash();
})();

</script>
</body>
</html>
